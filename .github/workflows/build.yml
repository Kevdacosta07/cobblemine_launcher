name: Build Cobblemine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            command: npm run dist:win
          - os: macos-15-intel
            target: mac-x64
            command: npx electron-builder --mac dmg zip --x64 --publish never
          - os: macos-15
            target: mac-arm64
            command: npx electron-builder --mac dmg zip --arm64 --publish never
          - os: ubuntu-22.04
            target: linux-x64
            command: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libgtk-3-0 libnss3 libasound2
      - run: npm ci
      - run: npm test
      - name: Set build directory
        run: node -e "const fs=require('fs');const p=require('./package.json');p.build.directories.output='dist';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged launcher and native Java 21
        if: runner.os != 'Linux'
        run: node scripts/check-platform.cjs
      - name: Verify Linux launcher and native Java 21
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/check-platform.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Cobblemine-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/platform-check.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Diagnostics-${{ matrix.target }}
          path: .ci-smoke/*.log
          if-no-files-found: ignore
